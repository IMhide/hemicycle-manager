name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Le pipeline data n'est pas requis pour type-check ni build, mais les
      # pages prérendues (/, /deputes, /groupes, /classements, /scrutins)
      # font des `fetch` au build. On mock le minimum nécessaire pour le
      # nouveau modèle multi-législature (cf ADR 0015-0020).
      - name: Generate placeholder static data
        run: |
          mkdir -p static/data/scrutins static/data/historique static/data/groupes
          echo '[]' > static/data/personnes.json
          echo '[]' > static/data/scrutins-index.json
          echo '[{"num":15,"dateDebut":"2017-06-21","dateFin":"2022-06-21","nbPersonnes":0,"nbScrutins":0},{"num":16,"dateDebut":"2022-06-22","dateFin":"2024-06-09","nbPersonnes":0,"nbScrutins":0},{"num":17,"dateDebut":"2024-07-08","dateFin":null,"nbPersonnes":0,"nbScrutins":0}]' > static/data/legislatures.json
          echo '[]' > static/data/groupes/15.json
          echo '[]' > static/data/groupes/16.json
          echo '[]' > static/data/groupes/17.json
          echo '{"generatedAt":"1970-01-01T00:00:00Z","legislatures":[15,16,17],"counts":{"personnes":0,"mandats":0,"groupes":0,"scrutins":0},"sources":{}}' > static/data/meta.json

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

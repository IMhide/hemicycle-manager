<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- La meta description est émise par +layout.svelte (pilotée par page via
		     data.description, cf ADR 0043) — pas ici, pour éviter les doublons. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<script>
			// Anti-FOUC : applique le thème avant le rendu (cf src/lib/theme.svelte.ts)
			(function () {
				try {
					var t = localStorage.getItem('politidex-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.setAttribute('data-theme', t);
					if (t === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-fg font-body antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

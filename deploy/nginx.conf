server {
	listen 80 default_server;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Gzip
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/javascript
		application/x-javascript
		application/xml
		application/json
		application/xml+rss
		image/svg+xml;

	# Long cache for hashed assets
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Data files: cache 1h, can be force-refreshed by query string
	location /data/ {
		expires 1h;
		add_header Cache-Control "public, must-revalidate";
	}

	# ── Routage (cf ADR 0041) ────────────────────────────────────────────────
	# La plupart des pages sont désormais prérendues (SSG) : elles ont leur
	# propre `index.html` sur disque. Seules quelques routes restent en SPA
	# client-side (scrutins par uid, législatures/triennats, groupes) et ont
	# besoin de la coquille `200.html` pour booter. On scope donc la coquille
	# à ces préfixes UNIQUEMENT — pas en catch-all — pour qu'une URL réellement
	# inconnue renvoie un VRAI 404 (et non un soft-404 = home en HTTP 200).

	# Routes restées SPA : la coquille 200.html sert de fallback. Les enfants
	# prérendus de ces préfixes (ex. la liste /assemblee/scrutins/) sont servis
	# d'abord via $uri/index.html ; seuls les [uid]/[periode]/… SPA retombent
	# sur 200.html.
	location /assemblee/scrutins/ {
		try_files $uri $uri/index.html /200.html;
	}
	location /assemblee/groupes/ {
		try_files $uri $uri/index.html /200.html;
	}
	location /assemblee/legislatures/ {
		try_files $uri $uri/index.html /200.html;
	}
	location /senat/scrutins/ {
		try_files $uri $uri/index.html /200.html;
	}
	location /senat/groupes/ {
		try_files $uri $uri/index.html /200.html;
	}
	location /senat/triennats/ {
		try_files $uri $uri/index.html /200.html;
	}

	# Défaut : servir le fichier ou l'index prérendu ; sinon VRAI 404.
	location / {
		try_files $uri $uri/index.html =404;
	}

	# Page 404 réelle prérendue (stylée comme l'app). Cf route /404.
	error_page 404 /404/index.html;

	# Security headers
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# HSTS (cf ADR 0045) : force HTTPS pendant 1 an. `preload` à ajouter une fois
	# le domaine soumis à hstspreload.org (engagement difficile à révoquer).
	# NB : la redirection http→https (307→308) et le trailing-slash se règlent au
	# niveau Traefik/Coolify (hors de ce fichier) — à déléguer à coolify_control.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
